name: Download Llama Model

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Llama CLI
        run: |
          pip install -U llama-stack

      - name: List Models
        run: |
          llama model list

      - name: Download Llama 4 Maverick
        env:
          LLAMA_URL: ${{ secrets.LLAMA_DOWNLOAD_URL }}
        run: |
          mkdir -p models

          printf "%s\n" "$LLAMA_URL" | \
          llama model download \
          --source meta \
          --model-id Llama-4-Maverick

      - name: Upload Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-model
          path: models/
